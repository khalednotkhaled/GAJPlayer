name: GAJPlayer
options:
  bundleIdPrefix: com.custom
  deploymentTarget:
    iOS: "17.0"
targets:
  GAJPlayer:
    type: application
    platform: iOS
    sources:
      - GAJPlayerApp.swift
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "MusiQ"
        CFBundleName: "MusiQ"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSPhotoLibraryUsageDescription: "Select custom cover art from your photo library."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.custom.musiqplayer
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
